<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>صفحة الأستاذ - إرسال الطلب</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,Tahoma,sans-serif;
  background:#f4f7fb;
  color:#172033;
}

header{
  background:#123b5d;
  color:#fff;
  padding:22px;
  text-align:center;
}

.container{
  max-width:800px;
  margin:auto;
  padding:20px;
}

.card{
  background:#fff;
  border-radius:15px;
  padding:20px;
  margin:15px 0;
  box-shadow:0 4px 16px #0001;
}

h1,h2{
  margin-top:0;
}

label{
  display:block;
  font-weight:bold;
  margin-top:14px;
}

input,
select,
textarea{
  width:100%;
  padding:11px;
  margin-top:6px;
  border:1px solid #ccd6e2;
  border-radius:8px;
  font:inherit;
}

textarea{
  min-height:100px;
  resize:vertical;
}

button{
  border:0;
  border-radius:9px;
  padding:12px 18px;
  cursor:pointer;
  font:inherit;
}

.primary{
  background:#1769aa;
  color:#fff;
}

.success{
  background:#e8f7ee;
  color:#17633b;
  padding:13px;
  border-radius:8px;
  margin-top:15px;
}

.error{
  background:#fdecec;
  color:#a11;
  padding:13px;
  border-radius:8px;
  margin-top:15px;
}

.small{
  color:#607086;
  font-size:14px;
}

.actions{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin-top:18px;
}
</style>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
const SUPABASE_URL =
"https://niedzlyvricaofqasohe.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
"sb_publishable_iDvPZL5m8A_bfItO0Q9muA_VHJU5-V_";

const supabaseClient =
window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_PUBLISHABLE_KEY
);
</script>

</head>

<body>

<header>
  <h1>📨 إرسال طلب إلى المخبري</h1>
  <div>متوسطة قايد أحمد – غليزان</div>
</header>

<div class="container">

  <div class="card">

    <h2>طلب الأستاذ</h2>

    <p class="small">
      يرجى ملء المعلومات التالية ثم الضغط على «إرسال الطلب».
    </p>

    <label>
      اسم الأستاذ
      <input
        id="teacherName"
        type="text"
        placeholder="اكتب اسم الأستاذ"
      >
    </label>

    <label>
      القسم
      <input
        id="className"
        type="text"
        placeholder="مثال: 4 متوسط 1"
      >
    </label>

    <label>
      تاريخ الطلب
      <input
        id="requestDate"
        type="date"
      >
    </label>

    <label>
      وقت الطلب
      <input
        id="requestTime"
        type="time"
      >
    </label>

    <label>
      نص الطلب
      <textarea
        id="requestText"
        placeholder="اكتب تفاصيل الطلب أو التجربة..."
      ></textarea>
    </label>

    <label>
      الأدوات والوسائل المطلوبة
      <textarea
        id="tools"
        placeholder="اكتب الأدوات أو الوسائل المطلوبة..."
      ></textarea>
    </label>

    <label>
      ملاحظات
      <textarea
        id="notes"
        placeholder="ملاحظات إضافية..."
      ></textarea>
    </label>

    <div class="actions">

      <button
        class="primary"
        onclick="sendTeacherRequest()"
      >
        📤 إرسال الطلب
      </button>

      <button
        onclick="clearForm()"
      >
        مسح
      </button>

    </div>

    <div id="message"></div>

  </div>

</div>

<script>

function setCurrentDateTime(){

  const now = new Date();

  const date =
    now.toISOString().slice(0,10);

  const time =
    now.toTimeString().slice(0,5);

  document.getElementById("requestDate").value =
    date;

  document.getElementById("requestTime").value =
    time;
}


async function sendTeacherRequest(){

  const teacherName =
    document.getElementById("teacherName").value.trim();

  const className =
    document.getElementById("className").value.trim();

  const requestDate =
    document.getElementById("requestDate").value;

  const requestTime =
    document.getElementById("requestTime").value;

  const requestText =
    document.getElementById("requestText").value.trim();

  const tools =
    document.getElementById("tools").value.trim();

  const notes =
    document.getElementById("notes").value.trim();

  const message =
    document.getElementById("message");


  if(!teacherName){

    message.innerHTML =
      '<div class="error">يرجى إدخال اسم الأستاذ.</div>';

    return;
  }


  if(!className){

    message.innerHTML =
      '<div class="error">يرجى إدخال القسم.</div>';

    return;
  }


  if(!requestText){

    message.innerHTML =
      '<div class="error">يرجى كتابة نص الطلب.</div>';

    return;
  }


  message.innerHTML =
    '<div class="small">⏳ جاري إرسال الطلب...</div>';


  try{

    const { error } =
      await supabaseClient
        .from("requests")
        .insert({

          teacher: teacherName,

          class_name: className,

          request_date:
            requestDate ||
            new Date().toISOString().slice(0,10),

          request_time:
            requestTime ||
            new Date().toTimeString().slice(0,5),

          request_text:
            requestText,

          tools:
            tools,

          notes:
            notes,

          status:
            "جديد",

          is_read:
            false

        });


    if(error){

      console.error(
        "REQUEST ERROR:",
        error
      );

      message.innerHTML =
        '<div class="error">' +
        '❌ تعذر إرسال الطلب:<br><br>' +
        error.message +
        '</div>';

      return;
    }


    message.innerHTML =
      '<div class="success">' +
      '✅ تم إرسال الطلب بنجاح إلى المخبري.' +
      '</div>';


    document.getElementById(
      "requestText"
    ).value = "";

    document.getElementById(
      "tools"
    ).value = "";

    document.getElementById(
      "notes"
    ).value = "";


    setCurrentDateTime();


  }catch(error){

    console.error(
      "SEND REQUEST ERROR:",
      error
    );

    message.innerHTML =
      '<div class="error">' +
      '❌ حدث خطأ أثناء إرسال الطلب:<br><br>' +
      error.message +
      '</div>';

  }

}
function clearForm(){

  document.getElementById("teacherName").value = "";

  document.getElementById("className").value = "";

  document.getElementById("requestText").value = "";

  document.getElementById("tools").value = "";

  document.getElementById("notes").value = "";

  document.getElementById("message").innerHTML = "";

  setCurrentDateTime();
}


document.addEventListener(
  "DOMContentLoaded",
  function(){

    setCurrentDateTime();

  }
);

</script>

</body>
</html>
